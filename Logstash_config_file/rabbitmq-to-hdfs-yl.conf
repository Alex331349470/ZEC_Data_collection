input {
    rabbitmq {
        host => "10.10.15.180"
        port => 5672
        user => "test"
        password => "test"
        queue => "DCS_YL_GATHER_1"
        exchange => "DCS_DATA_YL_1"
        vhost => "ZEC_SCADA"
        durable => true
        auto_delete => false
        prefetch_count => 32
        codec => plain
    }
}

filter {
	json {
		source => "message"
		target => "message"
	}
	
	date {
		match => ["[message][timestamp]", "UNIX"]
		target => "[message][timestamp]"		
	}
	mutate{
		add_field=>{
			'output_prefix'=>'/zec_data_yl/'
		}
	}
	
	
	ruby{
		code=> "event.set('[message][timestamp_plus]', LogStash::Timestamp.at(event.get('[message][timestamp]').time.localtime + 8*60*60))"
	}

	
	grok{
		match=>{
			"[message][timestamp_plus]"=>"(?<rtd_date>\d{4}-\d{2}-\d{2})T(?<rtd_time>(?<rtd_hour>\d{2}):\d{2}:\d{2})\.\d{3}Z"
		}
		
		add_field => {
			"[message][rtd_date_time]" => "%{rtd_date} %{rtd_time}"
		}
	}

	ruby {
		code => '
			event.get("[message][data]").each{ |k, v|
				full_name="#{k}"
				name = full_name.split("_")[0]

				case name
				when "GQ1001", "GQ1002", "GQ1003", "GQ1004", "GQ1041", "GQ1042", "GQ1061", "GK1021", "GK1022", "GK1023", "GK1024", "GK1051", "GK1052", "GK1066", "GQ1005", "GQ1006", "GQ1007", "GQ1008", "GQ1043", "GQ1044", "GQ1062", "GK1025", "GK1026", "GK1027", "GK1028", "GK1053", "GK1054", "GK1067", "GQ1009", "GQ1010", "GQ1011", "GQ1012", "GQ1045", "GQ1046", "GQ1063", "GK1029", "GK1030", "GK1031", "GK1032", "GK1055", "GK1056", "GK1068", "GK1013", "GK1014", "GK1015", "GK1016", "GK1047", "GK1048", "GK1064", "GK1033", "GK1034", "GK1035", "GK1036", "GK1057", "GK1058", "GK1069", "GK1017", "GK1018", "GK1019", "GK1020", "GK1049", "GK1050", "GK1065", "GK1037", "GK1038", "GK1039", "GK1040", "GK1059", "GK1060", "GK1070"
					rtd_index = "kiln"
				# when "SS1001", "SS1002", "SS1021", "SS1031", "SS1003", "SS1004", "SS1022", "SS1032", "SS1005", "SS1006", "SS1023", "SS1033", "SS1007", "SS1008", "SS1024", "SS1034", "SS1009", "SS1010", "SS1025", "SS1035", "SS1011", "SS1012", "SS1026", "SS1036", "SS1013", "SS1014", "SS1027", "SS1037", "SS1015", "SS1016", "SS1028", "SS1038", "SS1017", "SS1018", "SS1029", "SS1039", "SS1019", "SS1020", "SS1030", "SS1040"
					# rtd_index = "autoline"
				# when "HL1001", "HL1002", "HL1003", "HL1004", "HL1005", "HL1006", "HL1007", "HL1008", "HL1009", "HL1010"
					# rtd_index = "pl_mixer"
				# when "LX1001", "LX1011", "LX1021", "LX1031", "LX1046", "LX1056", "LX1002", "LX1012", "LX1022", "LX1032", "LX1047", "LX1057", "LX1003", "LX1013", "LX1023", "LX1033", "LX1048", "LX1058", "LX1004", "LX1014", "LX1024", "LX1034", "LX1049", "LX1059", "LX1005", "LX1015", "LX1025", "LX1035", "LX1050", "LX1060", "LX1006", "LX1016", "LX1026", "LX1036", "LX1051", "LX1061", "LX1007", "LX1017", "LX1027", "LX1037", "LX1052", "LX1062", "LX1008", "LX1018", "LX1028", "LX1038", "LX1053", "LX1063", "LX1009", "LX1019", "LX1029", "LX1039", "LX1054", "LX1064", "LX1010", "LX1020", "LX1030", "LX1040", "LX1055", "LX1065"
					# rtd_index = "pneumatic_convery"
				when "WL1001", "WL1021", "WL1011", "WL1002", "WL1012", "WL1022", "WL1003", "WL1013", "WL1023", "WL1004", "WL1014", "WL1024", "WL1005", "WL1015", "WL1025", "WL1006", "WL1016", "WL1026", "WL1007", "WL1017", "WL1027", "WL1008", "WL1018", "WL1028", "WL1009", "WL1019", "WL1029", "WL1010", "WL1020", "WL1030"
					rtd_index = "vortex_mill"
				# when "QL1001", "QL1002", "QL1003", "QL1004", "QL1005", "QL1006", "QL1007", "QL1008", "QL1009", "QL1010", "QL1011", "QL1012", "QL1013", "QL1014", "QL1015", "QL1016", "QL1017", "QL1018", "QL1019", "QL1020"
					# rtd_index = "jet_mill"
				# when "XL1021", "XL1022", "XL1023", "XL1024", "XL1025", "XL1026", "XL1027", "XL1028", "XL1029", "XL1030"
					# rtd_index = "disc_mill"
				# when "BK1001", "BK1002", "BK1003", "BK1004", "BK1005", "BK1006", "BK1007", "BK1008", "BK1009", "BK1010"
					# rtd_index = "filter_press"
				# when "ER1001", "ER1011", "ER1002", "ER1012", "ER1003", "ER1013", "ER1004", "ER1014", "ER1005", "ER1015", "ER1006", "ER1016", "ER1007", "ER1017", "ER1008", "ER1018", "ER1009", "ER1019", "ER1010", "ER1020"
					# rtd_index = "iron_remover"
				# when "WB1001", "WB1002", "WB1003"
					# rtd_index = "micro_wave"
				# when "DG1001", "DG1002", "DG1003", "DG1004", "DG1005", "DG1006", "DG1007", "DG1008", "DG1009", "DG1010", "DG1011", "DG1012", "DG1013", "DG1014", "DG1015", "DG1016", "DG1017", "DG1018", "DG1019", "DG1020"
					# rtd_index = "roller"
				else
					rtd_index = "not_exist"
				end


				if full_name[-1] == "_"
					line = "NONE"
				else
					line = full_name.split("_")[1]
				end

				event.set("[message][data][#{k}][rtd_timestamp]", event.get("[message][rtd_date_time]"))
				event.set("[message][data][#{k}][rtd_name]", name)
				event.set("[message][data][#{k}][rtd_line]", line)
				event.set("[message][data][#{k}][rtd_index]", rtd_index)
				event.set("[message][data][#{k}][rtd_date]", event.get("rtd_date"))
				event.set("[message][data][#{k}][rtd_hour]", event.get("rtd_hour"))
				event.set("[message][data][#{k}][rtd_time]", event.get("rtd_time"))
				event.set("[message][data][#{k}][rtd_type]",event.get("[message][type]"))
		}
		event.set("message", event.get("[message][data]").values)
		'
	}

	

	mutate {
		remove_field => ['event']
	}

	split {
		field => "message"
	}
}


output {
	webhdfs{
			host=>"master"
			port=>50070
			user=>"alex"
			compression=>snappy
			# snappy_format=>file
			path=>"%{output_prefix}%{[message][rtd_index]}/rtd_date=%{[message][rtd_date]}/rtd_hour=%{[message][rtd_hour]}/rtd_line=%{[message][rtd_line]}/rtd_name=%{[message][rtd_name]}/data.json"
			codec=>line{ format=>"%{message}"}
			# write_behavior=>"overwrite"
			# flush_interval=>60
			# gzip=>true
			flush_size => 20000
    		idle_flush_time => 50
    		retry_interval => 45
		}
}
